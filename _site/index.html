---
layout: layouts/default.html
image: /img/headers/photo-1562447574-797880741dd1.jpg
---

<div class="ryoko" style="background-image: url(/img/headers/photo-1562447574-797880741dd1.jpg)">
  <div class="ryoko-shade ryoko-body">
    <div class="ryoko-faded text-white p-3 my-3">
      <h3>disjfa.nl</h3>
    </div>
  </div>
</div>


<div class="container py-3">
  <h3>
    <i class="fa fa-fw fa-newspaper-o"></i>
    Blog
  </h3>
  <div class="row">
    {%- for post in collections.posts -%}
    <div class="col-12 col-lg-4 py-2">
      <a href="{{ post.url }}" class="d-block">
        {% if post.data.image %}
        <img src="{{ post.data.image }}" alt="" class="img-thumbnail mb-2">
        {% endif %}
        <h4>
          {{ post.data.title }}
        </h4>
      </a>
      <div>
        <small class="card-text text-muted">
        </small>
      </div>
      <p>{{ post.intro }}</p>
      <a href="{{ post.url }}" class="btn btn-outline-primary">
        <i class="fa fa-angle-double-right"></i>
        Read more
      </a>
    </div>
    {%- endfor -%}
    <div class="col-12">
      <a href="{{ '/blog/' }}" class="btn btn-primary">
        <i class="fa fa-fw fa-newspaper-o"></i>
        More blog items
      </a>
    </div>
  </div>
</div>
