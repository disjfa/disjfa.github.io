<div class="container py-3">
  <div class="row">

      <h1>{{ title }}</h1>

      <p>
        A web page created for the
        <a href="https://a-k-apart.com/">10k apart</a> contest.
      </p>

        </a>
        <a
          href="https://wordpress.org/themes/dimme-jour/"
          class="btn btn-outline-primary"
          aria-label="Get the theme on the wordpress website"

    </div>

      <img

        alt="Example of the glynn admin template"
